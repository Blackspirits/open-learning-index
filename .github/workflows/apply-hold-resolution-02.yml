name: Apply Hold Resolution 02

on:
  push:
    branches:
      - screening/hold-resolution-02

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, 'Apply hold resolution 02 current flags') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: screening/hold-resolution-02
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install jsonschema
      - run: python scripts/apply_hold_resolution_02.py
      - run: python scripts/validate.py
      - run: python scripts/generate_csv.py
      - run: git diff --exit-code -- data/courses.csv
      - run: python scripts/check_staleness.py
      - name: Commit resolved current flags and remove migration helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/apply_hold_resolution_02.py .github/workflows/apply-hold-resolution-02.yml
          git add data/screening
          git commit -m "Apply hold resolution 02 current flags"
          git push origin HEAD:screening/hold-resolution-02
