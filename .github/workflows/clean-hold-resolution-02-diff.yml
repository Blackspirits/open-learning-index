name: Clean Hold Resolution 02 Diff

on:
  push:
    branches:
      - screening/hold-resolution-02

permissions:
  contents: write

jobs:
  clean:
    if: ${{ !contains(github.event.head_commit.message, 'Clean hold resolution 02 diff') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: screening/hold-resolution-02
          fetch-depth: 0
      - name: Restore shallow-02 formatting and flip only superseded current flags
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path

          path = Path('data/screening/shallow-02.json')
          text = subprocess.check_output(['git', 'show', 'origin/main:data/screening/shallow-02.json'], text=True)
          targets = [
              'shallow-02-hubspot-inbound-marketing-optimization',
              'shallow-02-openlearn-companies-financial-accounting',
              'shallow-02-mit-ids-910-leadership-development-2014',
              'shallow-02-mit-15-280-communication-managers',
          ]
          for sid in targets:
              marker = f'"screen_id": "{sid}"'
              start = text.index(marker)
              end = text.find('\n  },', start)
              if end == -1:
                  end = text.find('\n  }\n]', start)
              block = text[start:end]
              if '"is_current": true' not in block:
                  raise SystemExit(f'current flag not found for {sid}')
              block = block.replace('"is_current": true', '"is_current": false', 1)
              text = text[:start] + block + text[end:]
          path.write_text(text, encoding='utf-8')
          PY
      - run: python scripts/validate.py
      - name: Commit clean diff and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/clean-hold-resolution-02-diff.yml
          git add data/screening/shallow-02.json
          git commit -m "Clean hold resolution 02 diff"
          git push origin HEAD:screening/hold-resolution-02
