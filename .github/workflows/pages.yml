name: Deploy public index

on:
  push:
    branches:
      - main
    paths:
      - 'data/courses.json'
      - 'data/categories.json'
      - 'data/reviews/**'
      - 'data/reference-reviews.json'
      - 'data/admissions/**'
      - 'site/**'
      - 'scripts/build_public_site.py'
      - 'scripts/editorial_presentation.py'
      - 'scripts/check_locale_coverage.py'
      - 'scripts/validate_public_site.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Test editorial presentation
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Enforce pt-PT editorial locale coverage
        run: python scripts/check_locale_coverage.py --locale pt-PT --enforce
      - name: Enforce Spanish editorial locale coverage
        run: python scripts/check_locale_coverage.py --locale es --enforce
      - name: Enforce French editorial locale coverage
        run: python scripts/check_locale_coverage.py --locale fr --enforce

      - name: Validate canonical dataset
        run: python scripts/validate.py

      - name: Build public site
        run: python scripts/build_public_site.py

      - name: Validate public site
        run: python scripts/validate_public_site.py _site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '_site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
