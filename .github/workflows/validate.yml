name: Validate dataset

on:
  push:
  pull_request:
  schedule:
    - cron: '17 6 * * 1'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Test editorial presentation
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Enforce pt-PT editorial locale coverage
        run: python scripts/check_locale_coverage.py --locale pt-PT --enforce
      - name: Enforce Spanish editorial locale coverage
        run: python scripts/check_locale_coverage.py --locale es --enforce
      - name: Enforce French editorial locale coverage
        run: python scripts/check_locale_coverage.py --locale fr --enforce
      - run: python scripts/validate.py
      - run: python scripts/generate_csv.py
      - run: git diff --exit-code -- data/courses.csv
      - name: Build public site
        run: python scripts/build_public_site_public.py --output /tmp/open-learning-index-site
      - name: Validate public site
        run: python scripts/validate_public_site_public.py /tmp/open-learning-index-site
      - name: Report review freshness
        if: github.event_name != 'schedule'
        run: python scripts/check_staleness.py
      - name: Enforce scheduled maintenance SLA
        if: github.event_name == 'schedule'
        run: python scripts/check_staleness.py --enforce-priority
