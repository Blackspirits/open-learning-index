<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">Open Learning Index</title>
  <desc id="desc">Warm editorial-library banner matching the live Open Learning Index homepage, with the Learning opens new horizons headline and explicit Portuguese language provenance.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f5f1e8"/>
      <stop offset="1" stop-color="#ebe5d8"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#006f62"/>
      <stop offset="1" stop-color="#55b9a8"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="175%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#143840" flood-opacity=".14"/>
    </filter>
    <filter id="smallShadow" x="-30%" y="-30%" width="160%" height="175%">
      <feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#17343b" flood-opacity=".12"/>
    </filter>
  </defs>

  <rect width="1600" height="520" rx="30" fill="url(#paper)"/>
  <circle cx="1455" cy="72" r="185" fill="#dceee8" opacity=".76"/>
  <circle cx="1235" cy="492" r="235" fill="#dbe9e9" opacity=".7"/>
  <path d="M0 446c247-41 401 32 626 1 215-30 349-127 584-108 164 14 254 70 390 58v123H0Z" fill="#dde9e4" opacity=".82"/>

  <g font-family="ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <g transform="translate(72 47)">
      <circle cx="23" cy="23" r="22" fill="#0f9b8a"/>
      <path d="M23 33V14M18 19l5-5 5 5M17 33h12" fill="none" stroke="#fff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="60" y="29" fill="#0b2a33" font-size="19" font-weight="760">Open Learning Index</text>
    </g>

    <text x="72" y="147" fill="#0b2632" font-size="15" font-weight="800" letter-spacing="1.8">INDEPENDENT · EVIDENCE-BASED · ALWAYS LEARNING</text>
    <text x="72" y="214" fill="#0b2632" font-size="61" font-weight="830" letter-spacing="-2.7">Learning opens</text>
    <text x="72" y="276" fill="#0b2632" font-size="61" font-weight="830" letter-spacing="-2.7">new horizons.</text>
    <text x="72" y="319" fill="#48636b" font-size="20" font-weight="560">A carefully curated index of exceptional free online learning.</text>

    <g transform="translate(72 350)" font-size="13.5" font-weight="730">
      <g>
        <rect width="178" height="40" rx="20" fill="#006f62"/>
        <text x="89" y="25" fill="#fff" text-anchor="middle">Quality over quantity</text>
      </g>
      <g transform="translate(192)">
        <rect width="157" height="40" rx="20" fill="#fff" fill-opacity=".9" stroke="#c5d8d5"/>
        <text x="78.5" y="25" fill="#27464e" text-anchor="middle">Evidence first</text>
      </g>
      <g transform="translate(363)">
        <rect width="178" height="40" rx="20" fill="#fff" fill-opacity=".9" stroke="#c5d8d5"/>
        <text x="89" y="25" fill="#27464e" text-anchor="middle">Interface: EN · PT-PT</text>
      </g>
    </g>

    <g transform="translate(72 415)" font-size="13">
      <text fill="#506b72" font-weight="720">Course-language provenance</text>
      <g transform="translate(0 15)">
        <rect width="68" height="30" rx="15" fill="#e1f1ec"/>
        <text x="34" y="20" fill="#006f62" font-weight="760" text-anchor="middle">PT-PT</text>
      </g>
      <g transform="translate(78 15)">
        <rect width="68" height="30" rx="15" fill="#e6eef5"/>
        <text x="34" y="20" fill="#315e79" font-weight="760" text-anchor="middle">PT-BR</text>
      </g>
      <g transform="translate(156 15)">
        <rect width="236" height="30" rx="15" fill="#f0ebe1"/>
        <text x="118" y="20" fill="#685f52" font-weight="700" text-anchor="middle">PT · variant not specified by provider</text>
      </g>
    </g>

    <g transform="translate(890 58)" filter="url(#shadow)">
      <rect width="638" height="393" rx="24" fill="#fdfbf6" stroke="#cadbd7" stroke-width="2"/>
      <path d="M32 115H606M32 249H606" stroke="#b3c9c4" stroke-width="3" stroke-linecap="round"/>

      <g filter="url(#smallShadow)">
        <rect x="65" y="57" width="49" height="58" rx="4" fill="#19414a"/>
        <rect x="119" y="47" width="35" height="68" rx="4" fill="#77bfae"/>
        <rect x="159" y="68" width="61" height="47" rx="4" fill="#d6a16a"/>
        <rect x="500" y="53" width="35" height="62" rx="4" fill="#2d6670"/>
        <rect x="541" y="72" width="30" height="43" rx="4" fill="#98cabc"/>
      </g>

      <g transform="translate(72 151)" filter="url(#smallShadow)">
        <path d="M0 12Q84-12 168 14v93Q86 76 0 103Z" fill="#fff" stroke="#c6d3cf" stroke-width="2"/>
        <path d="M168 14Q247-12 330 12v91q-80-28-162 4Z" fill="#fbf6e9" stroke="#c6d3cf" stroke-width="2"/>
        <path d="M168 14v93" stroke="#8cafaa" stroke-width="2"/>
        <path d="M27 35c48-9 84-8 119 1M27 54c44-8 81-7 119 2M191 35c42-8 78-8 111 0M191 54c43-7 78-6 112 2" fill="none" stroke="#98aaa8" stroke-width="2" opacity=".58"/>
      </g>

      <g transform="translate(474 154)">
        <circle cx="58" cy="49" r="45" fill="none" stroke="#73b9aa" stroke-width="2"/>
        <ellipse cx="58" cy="49" rx="70" ry="26" fill="none" stroke="#73b9aa" stroke-width="1.8" transform="rotate(-22 58 49)"/>
        <circle cx="15" cy="70" r="6" fill="#d99554"/>
        <circle cx="88" cy="10" r="5" fill="#0f9b8a"/>
      </g>

      <g transform="translate(56 286)" filter="url(#smallShadow)">
        <path d="M0 58h170l-25-47H23Z" fill="#e7d5a9"/>
        <path d="M25 11h120l25 47H50Z" fill="#fff9ea" stroke="#cfbf98"/>
        <path d="M73 24h58M65 36h74M57 48h87" stroke="#a89b7d" stroke-width="2" opacity=".65"/>
      </g>
      <g transform="translate(334 294)">
        <rect width="188" height="65" rx="12" fill="#dceee9"/>
        <path d="M25 45 62 18l30 21 35-31 32 27" fill="none" stroke="#2e786c" stroke-width="3" stroke-linejoin="round"/>
        <circle cx="157" cy="17" r="7" fill="#d99554"/>
      </g>
    </g>
  </g>
</svg>
