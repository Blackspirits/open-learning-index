<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">Open Learning Index</title>
  <desc id="desc">Warm editorial library banner matching the Open Learning Index website, with open books, paper, shelves and teal accents.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fbf8f0"/>
      <stop offset="1" stop-color="#eee9dc"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0b2a33"/>
      <stop offset="1" stop-color="#153f46"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0f9b8a"/>
      <stop offset="1" stop-color="#68c9b8"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#153b42" flood-opacity=".16"/>
    </filter>
    <filter id="smallShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#17343b" flood-opacity=".13"/>
    </filter>
  </defs>

  <rect width="1600" height="520" rx="30" fill="url(#paper)"/>
  <circle cx="1452" cy="76" r="180" fill="#dcefe9" opacity=".74"/>
  <circle cx="1205" cy="480" r="210" fill="#d9e9ed" opacity=".66"/>
  <path d="M0 438C260 390 398 466 642 432c218-30 332-126 566-105 164 15 254 69 392 54v139H0Z" fill="#dfeae5" opacity=".75"/>

  <g font-family="ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <g transform="translate(72 54)">
      <circle cx="23" cy="23" r="22" fill="#0f9b8a"/>
      <path d="M23 33V14M18 19l5-5 5 5M17 33h12" fill="none" stroke="#fff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="60" y="29" fill="#0b2a33" font-size="19" font-weight="760">Open Learning Index</text>
    </g>

    <text x="72" y="170" fill="#0b2632" font-size="63" font-weight="830" letter-spacing="-2.6">Learning opens</text>
    <text x="72" y="233" fill="#0b2632" font-size="63" font-weight="830" letter-spacing="-2.6">new horizons.</text>
    <text x="72" y="278" fill="#48636b" font-size="21" font-weight="560">Curated free learning, verified with evidence.</text>

    <g transform="translate(72 312)" font-size="13.5" font-weight="720">
      <g>
        <rect width="170" height="40" rx="20" fill="#0d8e7f"/>
        <text x="85" y="25" fill="#fff" text-anchor="middle">Quality over quantity</text>
      </g>
      <g transform="translate(184)">
        <rect width="152" height="40" rx="20" fill="#fff" stroke="#c9d9d8"/>
        <text x="76" y="25" fill="#27464e" text-anchor="middle">Evidence first</text>
      </g>
      <g transform="translate(350)">
        <rect width="190" height="40" rx="20" fill="#fff" stroke="#c9d9d8"/>
        <text x="95" y="25" fill="#27464e" text-anchor="middle">EN + PT-PT interface</text>
      </g>
    </g>

    <text x="72" y="405" fill="#6d7f82" font-size="14">142 published courses · 19 categories · continuously maintained</text>
    <text x="72" y="432" fill="#819094" font-size="12.5">Course languages distinguish pt-PT, pt-BR and unresolved provider-labelled Portuguese.</text>
  </g>

  <g transform="translate(870 66)" filter="url(#softShadow)">
    <path d="M60 84Q60 32 112 32H535Q588 32 588 84V352H60Z" fill="#fefcf7" stroke="#cddbd8" stroke-width="2"/>
    <path d="M88 128H560M88 242H560" stroke="#aec8c4" stroke-width="3" stroke-linecap="round"/>

    <g filter="url(#smallShadow)">
      <rect x="112" y="72" width="48" height="56" rx="4" fill="#19414a"/>
      <rect x="164" y="64" width="34" height="64" rx="4" fill="#78bfae"/>
      <rect x="202" y="82" width="58" height="46" rx="4" fill="#d9a66d"/>
      <rect x="474" y="70" width="34" height="58" rx="4" fill="#2f6670"/>
      <rect x="512" y="86" width="28" height="42" rx="4" fill="#99cabe"/>
    </g>

    <g transform="translate(115 160)" filter="url(#smallShadow)">
      <path d="M0 12Q74-12 148 14v79Q76 66 0 89Z" fill="#fff" stroke="#c6d3cf" stroke-width="2"/>
      <path d="M148 14Q218-12 290 12v77q-70-23-142 4Z" fill="#fbf6e9" stroke="#c6d3cf" stroke-width="2"/>
      <path d="M148 14v79" stroke="#8cafaa" stroke-width="2"/>
      <path d="M24 31c42-8 74-7 103 1M24 47c38-7 72-6 104 2M169 31c36-7 69-7 98 0M169 48c38-6 69-5 99 2" fill="none" stroke="#98aaa8" stroke-width="2" opacity=".58"/>
    </g>

    <g transform="translate(420 160)">
      <circle cx="55" cy="45" r="42" fill="none" stroke="#73b9aa" stroke-width="2"/>
      <ellipse cx="55" cy="45" rx="64" ry="24" fill="none" stroke="#73b9aa" stroke-width="1.8" transform="rotate(-22 55 45)"/>
      <circle cx="15" cy="65" r="6" fill="#d99554"/>
      <circle cx="83" cy="9" r="5" fill="#0f9b8a"/>
    </g>

    <g transform="translate(98 270)" filter="url(#smallShadow)">
      <path d="M0 56h150l-22-44H20Z" fill="#e7d5a9"/>
      <path d="M22 12h106l22 44H44Z" fill="#fff9ea" stroke="#cfbf98"/>
      <path d="M64 23h52M57 34h67M51 45h76" stroke="#a89b7d" stroke-width="2" opacity=".65"/>
    </g>
    <g transform="translate(310 278)">
      <rect width="164" height="62" rx="12" fill="#dceee9"/>
      <path d="M24 42 57 17l26 19 31-28 27 24" fill="none" stroke="#2e786c" stroke-width="3" stroke-linejoin="round"/>
      <circle cx="134" cy="17" r="7" fill="#d99554"/>
    </g>
  </g>
</svg>
