<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">Open Learning Index</title>
  <desc id="desc">Open Learning Index v1 banner matching the public site: independently reviewed free online courses, evidence-based curation and regular verification.</desc>
  <defs>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#dff4f5"/>
      <stop offset=".47" stop-color="#eef7f4"/>
      <stop offset="1" stop-color="#f5efe4"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffffff" stop-opacity=".98"/>
      <stop offset="1" stop-color="#fbf7ee" stop-opacity=".98"/>
    </linearGradient>
    <linearGradient id="shelf" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#173f49"/>
      <stop offset="1" stop-color="#0d2f38"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="170%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0b2538" flood-opacity=".12"/>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="170%" height="180%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#0b2538" flood-opacity=".10"/>
    </filter>
  </defs>

  <rect width="1600" height="520" rx="30" fill="url(#hero)"/>
  <circle cx="1480" cy="48" r="210" fill="#d7ebe6" opacity=".78"/>
  <circle cx="1240" cy="510" r="270" fill="#e6ddd0" opacity=".70"/>
  <path d="M0 454c220-34 382 22 580 4 247-23 417-119 661-90 138 16 244 55 359 47v105H0Z" fill="#d8e9e4" opacity=".72"/>

  <g font-family="ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <g transform="translate(72 48)">
      <circle cx="23" cy="23" r="22" fill="#079a86"/>
      <path d="M23 33V14M18 19l5-5 5 5M17 33h12" fill="none" stroke="#fff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="60" y="29" fill="#061d2d" font-size="19" font-weight="780">Open Learning Index</text>
    </g>

    <text x="72" y="139" fill="#007d6d" font-size="14" font-weight="850" letter-spacing="1.9">INDEPENDENT · EVIDENCE-BASED · REGULARLY VERIFIED</text>

    <text x="72" y="207" fill="#061d2d" font-size="54" font-weight="860" letter-spacing="-2.2">The best free online courses,</text>
    <text x="72" y="266" fill="#061d2d" font-size="54" font-weight="860" letter-spacing="-2.2">independently reviewed.</text>

    <text x="72" y="312" fill="#395269" font-size="19" font-weight="560">We verify real free access, teaching quality and currentness</text>
    <text x="72" y="340" fill="#395269" font-size="19" font-weight="560">before a course enters the index.</text>

    <g transform="translate(72 374)" font-size="13.5" font-weight="760">
      <g>
        <rect width="174" height="40" rx="20" fill="#007d6d"/>
        <text x="87" y="25" fill="#fff" text-anchor="middle">Quality over quantity</text>
      </g>
      <g transform="translate(188)">
        <rect width="143" height="40" rx="20" fill="#ffffff" fill-opacity=".88" stroke="#c8d6dd"/>
        <text x="71.5" y="25" fill="#173746" text-anchor="middle">Evidence first</text>
      </g>
      <g transform="translate(345)">
        <rect width="176" height="40" rx="20" fill="#ffffff" fill-opacity=".88" stroke="#c8d6dd"/>
        <text x="88" y="25" fill="#173746" text-anchor="middle">Regularly verified</text>
      </g>
    </g>

    <g transform="translate(72 438)" font-size="13" font-weight="760">
      <rect width="126" height="31" rx="15.5" fill="#dff5f0"/>
      <text x="63" y="20.5" fill="#007d6d" text-anchor="middle">Interface · EN</text>
      <g transform="translate(138)">
        <rect width="150" height="31" rx="15.5" fill="#e7f3ff"/>
        <text x="75" y="20.5" fill="#315e79" text-anchor="middle">Interface · PT-PT</text>
      </g>
      <g transform="translate(300)">
        <rect width="184" height="31" rx="15.5" fill="#fff0e6"/>
        <text x="92" y="20.5" fill="#9a4f1d" text-anchor="middle">Static · open · auditable</text>
      </g>
    </g>

    <g transform="translate(918 49)" filter="url(#shadow)">
      <rect width="610" height="415" rx="24" fill="url(#panel)" stroke="#c8d6dd" stroke-width="2"/>
      <rect x="34" y="32" width="542" height="42" rx="12" fill="#eef9f7"/>
      <circle cx="58" cy="53" r="11" fill="#079a86"/>
      <path d="M58 59V47M54.5 50.5l3.5-3.5 3.5 3.5M54 59h8" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="82" y="47" width="155" height="12" rx="6" fill="#173746" opacity=".88"/>
      <rect x="454" y="46" width="88" height="14" rx="7" fill="#dff5f0"/>

      <g transform="translate(44 103)">
        <rect width="522" height="248" rx="18" fill="#f5f1e8" stroke="#d7e1df"/>
        <path d="M22 92H500M22 180H500" stroke="#b8c9c6" stroke-width="3" stroke-linecap="round"/>

        <g filter="url(#softShadow)">
          <rect x="42" y="41" width="42" height="51" rx="4" fill="#173f49"/>
          <rect x="89" y="32" width="34" height="60" rx="4" fill="#55b9a8"/>
          <rect x="128" y="49" width="51" height="43" rx="4" fill="#d69a63"/>
          <rect x="389" y="37" width="31" height="55" rx="4" fill="#2d6670"/>
          <rect x="426" y="53" width="28" height="39" rx="4" fill="#91c9bb"/>
        </g>

        <g transform="translate(48 119)" filter="url(#softShadow)">
          <path d="M0 10Q64-8 128 12v74Q65 63 0 82Z" fill="#ffffff" stroke="#c6d3cf" stroke-width="2"/>
          <path d="M128 12Q191-8 253 10v72q-61-22-125 4Z" fill="#fff8e8" stroke="#c6d3cf" stroke-width="2"/>
          <path d="M128 12v74" stroke="#8cafaa" stroke-width="2"/>
          <path d="M21 29c36-7 64-6 91 1M21 45c34-6 62-5 92 1M146 29c31-6 59-6 84 0M146 45c32-5 60-4 85 1" fill="none" stroke="#98aaa8" stroke-width="2" opacity=".58"/>
        </g>

        <g transform="translate(349 120)">
          <circle cx="60" cy="45" r="39" fill="none" stroke="#55b9a8" stroke-width="2"/>
          <ellipse cx="60" cy="45" rx="63" ry="22" fill="none" stroke="#55b9a8" stroke-width="1.8" transform="rotate(-22 60 45)"/>
          <circle cx="23" cy="62" r="5" fill="#ff9850"/>
          <circle cx="86" cy="13" r="5" fill="#079a86"/>
        </g>
      </g>

      <g transform="translate(44 371)">
        <rect width="170" height="20" rx="10" fill="#dff5f0"/>
        <rect x="182" width="138" height="20" rx="10" fill="#e7f3ff"/>
        <rect x="332" width="190" height="20" rx="10" fill="#fff0e6"/>
      </g>
    </g>
  </g>
</svg>
