<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">Open Learning Index</title>
  <desc id="desc">Dark navy Open Learning Index banner with blue and cyan accents, evidence badges, and a trust panel matching the public site.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#06101d"/>
      <stop offset="0.52" stop-color="#0a1728"/>
      <stop offset="1" stop-color="#0d1c31"/>
    </linearGradient>
    <linearGradient id="accent" x1="225" y1="170" x2="860" y2="355" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8eafff"/>
      <stop offset="1" stop-color="#6ee7df"/>
    </linearGradient>
    <linearGradient id="panel" x1="1035" y1="92" x2="1455" y2="447" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" stop-opacity=".105"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".035"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientTransform="translate(1270 80) rotate(110) scale(360 460)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#10b9c7" stop-opacity=".22"/>
      <stop offset="1" stop-color="#10b9c7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientTransform="translate(280 520) rotate(-34) scale(510 390)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2563eb" stop-opacity=".27"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="46" height="46" patternUnits="userSpaceOnUse">
      <path d="M46 0H0V46" fill="none" stroke="#ffffff" stroke-opacity=".055"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="20" stdDeviation="25" flood-color="#000000" flood-opacity=".28"/>
    </filter>
  </defs>

  <rect width="1600" height="520" rx="28" fill="url(#bg)"/>
  <rect width="1600" height="520" rx="28" fill="url(#glowA)"/>
  <rect width="1600" height="520" rx="28" fill="url(#glowB)"/>
  <rect width="1600" height="520" rx="28" fill="url(#grid)" opacity=".8"/>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <g transform="translate(84 68)">
      <rect width="48" height="48" rx="14" fill="#2563eb" fill-opacity=".18" stroke="#a8c6ff" stroke-opacity=".32"/>
      <text x="24" y="30.5" fill="#c9fbff" font-size="13" font-weight="850" text-anchor="middle" letter-spacing="1.3">OLI</text>
      <text x="65" y="30" fill="#c5d4e9" font-size="17" font-weight="760">OPEN LEARNING INDEX</text>
    </g>

    <text x="84" y="205" fill="#f8fbff" font-size="75" font-weight="850" letter-spacing="-4.2">Open Learning</text>
    <text x="84" y="282" fill="url(#accent)" font-size="75" font-weight="850" letter-spacing="-4.2">Index</text>
    <text x="84" y="335" fill="#b9c7db" font-size="25" font-weight="650">Curated. Auditable. Continuously maintained.</text>
    <text x="84" y="375" fill="#899bb3" font-size="18">Exceptional free learning, verified with evidence.</text>

    <g transform="translate(84 413)" font-size="14" font-weight="720">
      <g>
        <rect width="190" height="38" rx="19" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".11"/>
        <circle cx="21" cy="19" r="5" fill="#59d8dd"/>
        <text x="36" y="24" fill="#aebbd0">Primary-source verification</text>
      </g>
      <g transform="translate(204)">
        <rect width="151" height="38" rx="19" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".11"/>
        <circle cx="21" cy="19" r="5" fill="#7fa7ff"/>
        <text x="36" y="24" fill="#aebbd0">No paywall bait</text>
      </g>
      <g transform="translate(369)">
        <rect width="183" height="38" rx="19" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".11"/>
        <circle cx="21" cy="19" r="5" fill="#59d8dd"/>
        <text x="36" y="24" fill="#aebbd0">Continuously maintained</text>
      </g>
    </g>

    <g transform="translate(980 72)" filter="url(#shadow)">
      <rect width="518" height="376" rx="28" fill="url(#panel)" stroke="#ffffff" stroke-opacity=".13"/>
      <text x="34" y="48" fill="#87dfe4" font-size="13" font-weight="820" letter-spacing="1.55">WHY TRUST THIS INDEX?</text>
      <text x="34" y="91" fill="#f6f9fd" font-size="31" font-weight="820" letter-spacing="-1.05">Not a popularity list.</text>
      <text x="34" y="123" fill="#aebdd1" font-size="15">Every published course earns its place.</text>

      <g transform="translate(34 153)">
        <g>
          <rect width="450" height="56" rx="15" fill="#08182a" fill-opacity=".52" stroke="#ffffff" stroke-opacity=".08"/>
          <rect x="14" y="12" width="32" height="32" rx="10" fill="#10b9c7" fill-opacity=".12" stroke="#87dfe4" stroke-opacity=".2"/>
          <path d="m23 28 6 6 10-13" fill="none" stroke="#78e1e5" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
          <text x="60" y="26" fill="#f6f9fd" font-size="15" font-weight="760">Access verified</text>
          <text x="60" y="44" fill="#91a2b8" font-size="12.5">What is actually free is checked.</text>
        </g>
        <g transform="translate(0 66)">
          <rect width="450" height="56" rx="15" fill="#08182a" fill-opacity=".52" stroke="#ffffff" stroke-opacity=".08"/>
          <rect x="14" y="12" width="32" height="32" rx="10" fill="#2563eb" fill-opacity=".16" stroke="#8eafff" stroke-opacity=".22"/>
          <path d="M22 36h16M22 30h11M22 24h16" fill="none" stroke="#9ebaff" stroke-width="2.2" stroke-linecap="round"/>
          <text x="60" y="26" fill="#f6f9fd" font-size="15" font-weight="760">Quality reviewed</text>
          <text x="60" y="44" fill="#91a2b8" font-size="12.5">Pedagogy, depth, practice and currency.</text>
        </g>
        <g transform="translate(0 132)">
          <rect width="450" height="56" rx="15" fill="#08182a" fill-opacity=".52" stroke="#ffffff" stroke-opacity=".08"/>
          <rect x="14" y="12" width="32" height="32" rx="10" fill="#10b9c7" fill-opacity=".12" stroke="#87dfe4" stroke-opacity=".2"/>
          <path d="M22 35h16M25 30l5-7 5 4 4-7" fill="none" stroke="#78e1e5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          <text x="60" y="26" fill="#f6f9fd" font-size="15" font-weight="760">Alternatives compared</text>
          <text x="60" y="44" fill="#91a2b8" font-size="12.5">Strong challengers are tested head-to-head.</text>
        </g>
      </g>

      <g transform="translate(34 352)">
        <rect width="128" height="2" rx="1" fill="#59d8dd" opacity=".75"/>
        <rect x="136" width="52" height="2" rx="1" fill="#7fa7ff" opacity=".7"/>
        <rect x="196" width="20" height="2" rx="1" fill="#ffffff" opacity=".22"/>
      </g>
    </g>
  </g>
</svg>
