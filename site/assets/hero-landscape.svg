  <path d="M0 505 205 366l129 112 184-155 137 128 168-142 113 107 148-157 167 174 171-107 178 151v243H0z" fill="url(#mid)" opacity=".96"/>
  <path d="M0 572 203 451l143 87 192-103 141 93 180-133 145 130 147-119 188 122 111-61 150 87v176H0z" fill="url(#near)"/>
