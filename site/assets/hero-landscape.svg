<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
  <title id="title">Layered mountain landscape</title>
  <desc id="desc">Original stylised blue mountain landscape used as the Open Learning Index homepage background.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9dcf2"/>
      <stop offset=".48" stop-color="#d9edf7"/>
      <stop offset="1" stop-color="#eef7f8"/>
    </linearGradient>
    <linearGradient id="far" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#89b9d0"/>
      <stop offset="1" stop-color="#527f9a"/>
    </linearGradient>
    <linearGradient id="mid" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#5f91a8"/>
      <stop offset="1" stop-color="#2f6178"/>
    </linearGradient>
    <linearGradient id="near" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#315e70"/>
      <stop offset="1" stop-color="#173847"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#1e4d5c"/>
      <stop offset="1" stop-color="#0b2732"/>
    </linearGradient>
    <radialGradient id="sun" cx=".7" cy=".16" r=".28">
      <stop stop-color="#fff" stop-opacity=".95"/>
      <stop offset=".35" stop-color="#fff" stop-opacity=".48"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="720" fill="url(#sky)"/>
  <rect width="1600" height="720" fill="url(#sun)"/>
  <circle cx="1180" cy="105" r="54" fill="#fff" opacity=".35"/>
